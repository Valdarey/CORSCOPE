[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corscope"
version = "1.0.0"
description = "Modular CORS Security Assessment CLI Tool"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{name = "CORSCOPE Contributors"}]
dependencies = ["typer>=0.12.0", "rich>=13.0.0", "requests>=2.31.0", "pydantic>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.5.0"]

[project.scripts]
corscope = "corscope.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
